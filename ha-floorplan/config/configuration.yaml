# =============================================================================
#  configuration.yaml · Home Assistant (Config as Code)
# =============================================================================

# Carga el conjunto estándar de integraciones (frontend, history, energy,
# mobile_app, person, zone, etc.). No lo quites salvo que sepas qué haces.
default_config:

homeassistant:
  # Zona horaria del núcleo: se lee de la variable TZ del docker-compose
  # (que viene de .env) → una sola fuente de verdad. Por defecto, Denver.
  time_zone: !env_var TZ America/Denver
  # Permite organizar configuración por "paquetes" en config/packages/
  # (útil cuando el proyecto crezca: un archivo por habitación o sistema).
  packages: !include_dir_named packages

# -----------------------------------------------------------------------------
#  Frontend y temas
# -----------------------------------------------------------------------------
frontend:
  # Carga todos los temas de config/themes/ (ver floorplan_dark.yaml).
  themes: !include_dir_merge_named themes
  # Tarjetas personalizadas cargadas como módulos globales, de forma
  # DECLARATIVA (no dependen de recursos guardados en .storage ni de HACS).
  # scripts/bootstrap.sh descarga estos archivos a config/www/vendor/.
  # Si aún no ejecutaste el script, la consola del navegador mostrará 404.
  extra_module_url:
    - /local/vendor/card-mod.js
    - /local/vendor/layout-card.js
    - /local/vendor/kiosk-mode.js
    # Tarjeta del modelo 3D (three.js viene de scripts/bootstrap.sh → www/vendor/three/)
    - /local/casa3d/casa3d-card.js

# -----------------------------------------------------------------------------
#  Dashboards en modo YAML
# -----------------------------------------------------------------------------
#  El dashboard principal ("Resumen") sigue en modo almacenamiento (UI). Las
#  tarjetas personalizadas se cargan con frontend.extra_module_url (arriba),
#  así que no hace falta registrar recursos. El floorplan se define 100 % en YAML:
#  cualquier cambio en dashboards/floorplan.yaml se ve con solo recargar
#  el navegador (no hace falta reiniciar Home Assistant).
lovelace:
  dashboards:
    # La clave es la URL: http://<host>:8123/casa-3d  (debe contener un guion)
    casa-3d:
      mode: yaml
      filename: dashboards/floorplan.yaml
      title: Casa 3D
      icon: mdi:floor-plan
      show_in_sidebar: true
      require_admin: false

# -----------------------------------------------------------------------------
#  Servidor HTTP
# -----------------------------------------------------------------------------
#  Sin proxy inverso no hace falta nada más. Si pones HA detrás de Nginx,
#  Traefik o Caddy, descomenta (y define proxy_ip en secrets.yaml):
# http:
#   use_x_forwarded_for: true
#   trusted_proxies:
#     - !secret proxy_ip
#  Bloquea IPs tras 5 intentos de login fallidos (crea ip_bans.yaml).
http:
  ip_ban_enabled: true
  login_attempts_threshold: 5

# -----------------------------------------------------------------------------
#  Helpers, sensores y la automatización del timbre viven en packages/:
#    packages/timbre.yaml     → helpers + automatización + script de prueba
#    packages/reciclaje.yaml  → día de recogida configurable + sensor
#  (para datos de ejemplo sin dispositivos: packages_available/demo.yaml)
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
#  Archivos incluidos (vacíos: reservados para lo que crees desde la UI)
# -----------------------------------------------------------------------------
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
