# =============================================================================
#  packages/tele.yaml · apagar/encender la tele de la sala (Philips Roku TV + Fire TV)
# -----------------------------------------------------------------------------
#  El Fire TV solo entra en reposo al "apagarlo". Para apagar la pantalla de verdad se
#  usa la integración de Roku (la tele es una Roku TV). Encender por red necesita
#  "Inicio rápido de la TV" activado en la tele (Ajustes > Sistema > Energía).
#  Entidades: integraciones Roku y Android Debug Bridge (Ajustes > Dispositivos).
# =============================================================================

script:
  tele_apagar:
    alias: "Tele · Apagar (Roku TV + Fire TV)"
    icon: mdi:television-off
    sequence:
      - action: media_player.turn_off
        target: {entity_id: media_player.living_room_fire_tv_living_room}
        continue_on_error: true
      - action: media_player.turn_off
        target: {entity_id: media_player.living_room_75_philips_roku_tv}

  tele_encender:
    alias: "Tele · Encender (Roku TV + Fire TV)"
    icon: mdi:television
    sequence:
      - action: media_player.turn_on
        target: {entity_id: media_player.living_room_75_philips_roku_tv}
      - delay: "00:00:08"
      - action: media_player.turn_on
        target: {entity_id: media_player.living_room_fire_tv_living_room}
        continue_on_error: true

  # Abre una app del Fire TV por nombre. Si el Fire TV está en reposo ("off"), lo despierta
  # primero y espera hasta 15 s. La app se lanza con "am start" porque media_player.select_source
  # no funciona en este Fire TV (Android 11): su comando usa "dumpsys window windows", que aquí
  # no devuelve nada, y la cadena se corta antes de abrir la app.
  # Para añadir una app: sus componentes salen de
  #   cmd package resolve-activity --brief -c android.intent.category.LEANBACK_LAUNCHER <paquete>
  fire_abrir_app:
    alias: "Fire TV · Abrir app"
    icon: mdi:television-play
    mode: restart
    fields:
      app:
        name: App
        description: Nombre de la app (YouTube, Disney+ o Spotify)
        example: YouTube
        required: true
    variables:
      componentes:
        "YouTube": com.amazon.firetv.youtube/dev.cobalt.app.MainActivity
        "Disney+": com.disney.disneyplus/com.bamtechmedia.dominguez.main.MainActivity
        "Spotify": com.spotify.tv.android/.SpotifyTVActivity
    sequence:
      - if:
          - condition: state
            entity_id: media_player.living_room_fire_tv_living_room
            state: ["off", "standby", "unavailable"]
        then:
          - action: media_player.turn_on
            target: {entity_id: media_player.living_room_fire_tv_living_room}
          - wait_template: "{{ states('media_player.living_room_fire_tv_living_room') not in ['off', 'standby', 'unavailable', 'unknown'] }}"
            timeout: "00:00:15"
            continue_on_timeout: true
          - delay: "00:00:02"
      - choose:
          - conditions: "{{ app in componentes }}"
            sequence:
              - action: androidtv.adb_command
                target: {entity_id: media_player.living_room_fire_tv_living_room}
                data:
                  command: "am start -n {{ componentes[app] }}"
        default:
          - action: media_player.select_source
            target: {entity_id: media_player.living_room_fire_tv_living_room}
            data:
              source: "{{ app }}"
