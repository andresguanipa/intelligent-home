# =============================================================================
#  dashboards/floorplan.yaml · "Casa 3D" · Tablet en horizontal
# -----------------------------------------------------------------------------
#  URL:        http://<host>:8123/casa-3d
#  Requiere:  layout-card · card-mod · kiosk-mode (cargados por
#             frontend.extra_module_url; ver scripts/bootstrap.sh) · Browser Mod
#  Sin dispositivos: copia packages_available/demo.yaml a config/packages/.
#  Recargar cambios:  basta con refrescar el navegador (modo YAML).
#
#  ENTIDADES DE EJEMPLO — sustitúyelas por las tuyas (Herramientas para
#  desarrolladores > Estados):
#    weather.forecast_home        → clima (Met.no, viene por defecto)
#    light.sala / light.cocina / light.dormitorio / light.suite
#    camera.timbre_puerta         → cámara del Nest Doorbell (ancla &camara_timbre)
#  El mapa es la tarjeta custom:casa3d-card (modelo three.js, ver CLAUDE.md §6).
#    person.andres_guanipa        → presencia
#    sensor.reciclaje             → definido en configuration.yaml
#    vacuum.robotina / camera.robotina_map → robot Dreame (Hogar)
#    media_player.spotify_andres_guanipa   → Spotify (Multimedia)
# =============================================================================

title: Casa 3D

# --- kiosk-mode --------------------------------------------------------------
# Oculta la barra superior y la lateral para un modo "pantalla de pared".
# Para editar/depurar, abre la URL con ?disable_km  (p. ej. /casa-3d?disable_km)
kiosk_mode:
  hide_header: true
  hide_sidebar: true

views:
  - title: Planta
    path: planta
    icon: mdi:home-floor-1
    theme: floorplan_dark

    # --- layout-card: vista en cuadrícula CSS Grid -----------------------------
    type: custom:grid-layout
    layout:
      # 1fr 2fr 1fr = 25 % · 50 % · 25 % del espacio útil, descontando los
      # huecos (usar 25% 50% 25% literales + gap desbordaría horizontalmente).
      grid-template-columns: 1fr 2fr 1fr
      grid-template-rows: auto
      grid-template-areas: |
        "izquierda centro derecha"
      grid-gap: 16px
      padding: 16px
      align-items: start
      # Responsivo: en vertical o pantallas estrechas, una sola columna
      # con el mapa arriba.
      mediaquery:
        "(max-width: 900px), (orientation: portrait)":
          grid-template-columns: 100%
          grid-template-areas: |
            "centro"
            "izquierda"
            "derecha"

    cards:
      # =======================================================================
      #  COLUMNA IZQUIERDA (25 %) · Clima grande + pronóstico
      # =======================================================================
      - type: vertical-stack
        view_layout:
          grid-area: izquierda
        cards:
          # Estado actual + pronóstico diario
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: true
            forecast_type: daily
            forecast_slots: 5
            # Estilo "cristal" reutilizable: el ancla &cristal se reutiliza
            # abajo con *cristal para no repetir el CSS.
            card_mod: &cristal
              style: |
                ha-card {
                  background: rgba(20, 24, 36, 0.55);
                  backdrop-filter: blur(16px) saturate(140%);
                  -webkit-backdrop-filter: blur(16px) saturate(140%);
                  border: 1px solid rgba(255, 255, 255, 0.08);
                  border-radius: 24px;
                  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
                }

          # Pronóstico por horas (tira compacta)
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: false
            show_forecast: true
            forecast_type: hourly
            forecast_slots: 6
            card_mod: *cristal

      # =======================================================================
      #  COLUMNA CENTRAL (50 %) · Modelo 3D three.js conectado a Home Assistant
      #  (config/www/casa3d/casa3d-card.js). Las luces salen de "light" en
      #  config/www/casa3d/house.json; aquí solo se sobrescribe lo necesario.
      #  Toque en una habitación o su icono = encender/apagar · mantener = más info.
      # =======================================================================
      - type: custom:casa3d-card
        view_layout:
          grid-area: centro
        aspect_ratio: "16/10"
        interactive: true           # arrastrar = girar · pellizcar/rueda = zoom (sin desplazar)
        # /local/ se cachea 31 días en el navegador: sube el número de ?v= cada vez
        # que edites house.json para que el navegador (y la tablet) lo vuelvan a bajar.
        house: /local/casa3d/house.json?v=6
        # lights:                   # id de habitación (house.json) → entidad
        #   sala: light.sala
        # openings:                 # puertas con sensor: on = abierta
        #   puerta_dorm2: binary_sensor.puerta_dormitorio
        markers:
          # Acceso manual a la cámara del timbre (junto a la entrada)
          - entity: &camara_timbre camera.front_door_front_door_doorbell  # edita SOLO esta línea
            icon: mdi:doorbell-video
            at: [3.2, 21]
          # Base de Robotina (Dreame): tocar abre sus controles
          - entity: vacuum.robotina
            icon: mdi:robot-vacuum
            at: [10.5, 1.6]         # pies; ajusta x (este) e y (sur) si hace falta
          # Tele (Roku TV: apagado real, volumen y entradas), centrada sobre el panel.
          # El 3.er valor de "at" es la altura en pies. El Fire TV se maneja desde Multimedia.
          - entity: media_player.living_room_75_philips_roku_tv
            name: Tele
            icon: mdi:television
            at: [0.6, 6.75, 3.6]
          # Botones de luz (virtuales: packages/luces_virtuales.yaml). Tocar = on/off,
          # mantener = más info. Cambia la entidad por la real cuando la tengas.
          - entity: light.sala_oeste
            name: Sala oeste
            icon: mdi:lightbulb
            at: [5.05, 6.7]
          - entity: light.sala_sur
            name: Sala sur
            icon: mdi:lightbulb
            at: [12.1, 20.6]
          - entity: light.pasillo_centro
            name: Pasillo centro
            icon: mdi:lightbulb
            at: [27.8, 14.9]
          - entity: light.pasillo_este
            name: Pasillo este
            icon: mdi:lightbulb
            at: [38.3, 15.1]
          - entity: light.fau
            name: FAU
            icon: mdi:lightbulb
            at: [27.6, 19.8]
          - entity: light.wc_suite
            name: WC suite
            icon: mdi:lightbulb
            at: [34.4, 19.9]
          - entity: light.bano_suite
            name: Baño suite
            icon: mdi:lightbulb
            at: [40.3, 19.9]
        # Cámara del timbre superpuesta (modo "overlay" de automations/timbre.yaml):
        # visible mientras input_boolean.timbre_overlay = on; tocar la cierra.
        doorbell:
          overlay: input_boolean.timbre_overlay
          camera: *camara_timbre
        card_mod:
          style: |
            ha-card {
              border: 1px solid rgba(255, 255, 255, 0.07);
              border-radius: 28px;
              box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55),
                          inset 0 1px 0 rgba(255, 255, 255, 0.05);
            }

      # =======================================================================
      #  COLUMNA DERECHA (25 %) · Información minimalista
      # =======================================================================
      - type: vertical-stack
        view_layout:
          grid-area: derecha
        cards:
          # --- Presencia -----------------------------------------------------
          - type: heading
            heading: Presencia
            heading_style: subtitle
          - type: tile
            entity: person.andres_guanipa
            name: Yo
            card_mod: *cristal

          # --- Hogar ---------------------------------------------------------
          - type: heading
            heading: Hogar
            heading_style: subtitle
          - type: tile
            entity: sensor.reciclaje
            name: Reciclaje
            icon: mdi:recycle
            color: green
            card_mod:
              style: |
                ha-card {
                  background: rgba(20, 24, 36, 0.55);
                  backdrop-filter: blur(16px);
                  -webkit-backdrop-filter: blur(16px);
                  border-radius: 24px;
                  border: 1px solid
                    {{ 'rgba(76, 217, 100, 0.65)'
                       if states('sensor.reciclaje') in ['Hoy', 'Mañana']
                       else 'rgba(255, 255, 255, 0.08)' }};
                }

          # --- Robotina (Dreame) ---------------------------------------------
          # Integración comunitaria dreame_vacuum (INSTALL_DREAME=1 en bootstrap).
          - type: tile
            entity: vacuum.robotina
            name: Robotina
            # Al tocar la tarjeta se abre el mapa del robot (ventana emergente).
            tap_action:
              action: more-info
              entity: camera.robotina_map
            card_mod: *cristal
            features:
              - type: vacuum-commands
                commands:
                  - start_pause
                  - return_home
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.robotina_battery_level
                name: Batería
                card_mod: *cristal
              - type: tile
                entity: sensor.robotina_cleaned_area
                name: Última limpieza
                icon: mdi:vector-square
                card_mod: *cristal

          # --- Multimedia (Spotify) -------------------------------------------
          # Integración oficial Spotify. La música suena en un dispositivo de
          # Spotify Connect activo (Nest Hub, móvil...); en "Fuente" se elige cuál.
          - type: heading
            heading: Multimedia
            heading_style: subtitle
          # Sonando o en pausa: reproductor completo con carátula.
          - type: conditional
            conditions:
              - condition: state
                entity: media_player.spotify_andres_guanipa
                state_not:
                  - "off"
                  - idle
                  - unavailable
                  - unknown
            card:
              type: media-control
              entity: media_player.spotify_andres_guanipa
              card_mod: *cristal
          # Inactivo: tarjeta compacta (abre el detalle y permite elegir fuente).
          - type: conditional
            conditions:
              - condition: state
                entity: media_player.spotify_andres_guanipa
                state:
                  - "off"
                  - idle
                  - unavailable
                  - unknown
            card:
              type: tile
              entity: media_player.spotify_andres_guanipa
              name: Spotify
              icon: mdi:spotify
              color: green
              tap_action:
                action: more-info
              card_mod: *cristal
          # Fire TV de la sala (integración Android Debug Bridge, por IP).
          - type: conditional
            conditions:
              - condition: state
                entity: media_player.living_room_fire_tv_living_room
                state_not:
                  - "off"
                  - standby
                  - idle
                  - unavailable
                  - unknown
            card:
              type: media-control
              entity: media_player.living_room_fire_tv_living_room
              card_mod: *cristal
          - type: conditional
            conditions:
              - condition: state
                entity: media_player.living_room_fire_tv_living_room
                state:
                  - "off"
                  - standby
                  - idle
                  - unavailable
                  - unknown
            card:
              type: tile
              entity: media_player.living_room_fire_tv_living_room
              name: Fire TV
              icon: mdi:television
              tap_action:
                action: fire-dom-event
                browser_mod: &mando_popup
                  service: browser_mod.popup
                  data:
                    title: Fire TV · Mando
                    size: normal
                    dismissable: true
                    content:
                      type: vertical-stack
                      cards:
                        - type: grid
                          columns: 3
                          square: false
                          cards:
                            - type: button
                              show_icon: false
                              show_name: false
                              tap_action:
                                action: none
                              card_mod:
                                style: |
                                  ha-card { background: none; box-shadow: none; border: none; backdrop-filter: none; }
                            - type: button
                              icon: mdi:chevron-up
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: UP
                              card_mod: &boton_mando
                                style: |
                                  ha-card {
                                    background: rgba(20, 24, 36, 0.55);
                                    backdrop-filter: blur(16px) saturate(140%);
                                    -webkit-backdrop-filter: blur(16px) saturate(140%);
                                    border: 1px solid rgba(255, 255, 255, 0.08);
                                    border-radius: 22px;
                                    height: 70px;
                                    display: flex; align-items: center; justify-content: center;
                                  }
                            - type: button
                              show_icon: false
                              show_name: false
                              tap_action:
                                action: none
                              card_mod:
                                style: |
                                  ha-card { background: none; box-shadow: none; border: none; backdrop-filter: none; }
                            - type: button
                              icon: mdi:chevron-left
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: LEFT
                              card_mod: *boton_mando
                            - type: button
                              icon: mdi:circle-medium
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: CENTER
                              card_mod: *boton_mando
                            - type: button
                              icon: mdi:chevron-right
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: RIGHT
                              card_mod: *boton_mando
                            - type: button
                              show_icon: false
                              show_name: false
                              tap_action:
                                action: none
                              card_mod:
                                style: |
                                  ha-card { background: none; box-shadow: none; border: none; backdrop-filter: none; }
                            - type: button
                              icon: mdi:chevron-down
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: DOWN
                              card_mod: *boton_mando
                            - type: button
                              show_icon: false
                              show_name: false
                              tap_action:
                                action: none
                              card_mod:
                                style: |
                                  ha-card { background: none; box-shadow: none; border: none; backdrop-filter: none; }
                        - type: grid
                          columns: 3
                          square: false
                          cards:
                            - type: button
                              icon: mdi:arrow-left
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: BACK
                              card_mod: *boton_mando
                            - type: button
                              icon: mdi:home
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: HOME
                              card_mod: *boton_mando
                            - type: button
                              icon: mdi:menu
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: MENU
                              card_mod: *boton_mando
                        - type: grid
                          columns: 3
                          square: false
                          cards:
                            - type: button
                              icon: mdi:rewind
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: REWIND
                              card_mod: *boton_mando
                            - type: button
                              icon: mdi:play-pause
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: "input keyevent 85"
                              card_mod: *boton_mando
                            - type: button
                              icon: mdi:fast-forward
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_fire_tv_living_room
                                data:
                                  command: FAST_FORWARD
                              card_mod: *boton_mando
                        - type: grid
                          columns: 3
                          square: false
                          cards:
                            - type: button
                              icon: mdi:volume-minus
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_75_philips_roku_tv
                                data:
                                  command: volume_down
                              card_mod: *boton_mando
                            - type: button
                              icon: mdi:volume-mute
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_75_philips_roku_tv
                                data:
                                  command: volume_mute
                              card_mod: *boton_mando
                            - type: button
                              icon: mdi:volume-plus
                              show_name: false
                              icon_height: 32px
                              tap_action:
                                action: perform-action
                                perform_action: remote.send_command
                                target:
                                  entity_id: remote.living_room_75_philips_roku_tv
                                data:
                                  command: volume_up
                              card_mod: *boton_mando
              card_mod: *cristal
          # Botones de apps del Fire TV. El botón "Source" de HA solo lista las apps que
          # están en ejecución, así que se lanzan por nombre (los de Ajustes > Android Debug
          # Bridge > Configurar > Aplicaciones). Añade más copiando un bloque.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: media_player.living_room_fire_tv_living_room
                name: YouTube
                icon: mdi:youtube
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: script.fire_abrir_app
                  data:
                    app: YouTube
                card_mod: *cristal
              - type: tile
                entity: media_player.living_room_fire_tv_living_room
                name: Disney+
                icon: mdi:movie-open-play
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: script.fire_abrir_app
                  data:
                    app: Disney+
                card_mod: *cristal
              - type: tile
                entity: media_player.living_room_fire_tv_living_room
                name: Spotify
                icon: mdi:spotify
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: script.fire_abrir_app
                  data:
                    app: Spotify
                card_mod: *cristal
              - type: tile
                entity: remote.living_room_fire_tv_living_room
                name: Mando
                icon: mdi:remote
                hide_state: true
                tap_action:
                  action: fire-dom-event
                  browser_mod: *mando_popup
                card_mod: *cristal
          # Botones de encendido/apagado completos de la tele (Roku TV + Fire TV).
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: script.tele_apagar
                name: Apagar tele
                icon: mdi:television-off
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.tele_apagar
                card_mod: *cristal
              - type: tile
                entity: script.tele_encender
                name: Encender tele
                icon: mdi:television
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.tele_encender
                card_mod: *cristal
