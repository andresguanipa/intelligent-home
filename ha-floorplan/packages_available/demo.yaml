# =============================================================================
#  packages_available/demo.yaml · entidades de ejemplo para probar SIN dispositivos
# -----------------------------------------------------------------------------
#  Activar:     cp packages_available/demo.yaml config/packages/demo.yaml  (y reiniciar)
#  Desactivar:  borra config/packages/demo.yaml
#  Crea light.sala / light.cocina / light.dormitorio (luces virtuales) y
#  person.yo / person.familiar, que el dashboard espera. No cubre
#  weather.*, media_player.sala ni la cámara/evento Nest: esas salen de
#  integraciones reales (Met.no ya viene con el asistente inicial).
#  No actives este paquete junto a luces reales con los mismos IDs.
# =============================================================================

input_boolean:
  demo_luz_sala:
    name: Demo · luz sala
  demo_luz_cocina:
    name: Demo · luz cocina
  demo_luz_dormitorio:
    name: Demo · luz dormitorio

template:
  - light:
      - name: Sala
        unique_id: demo_light_sala
        state: "{{ is_state('input_boolean.demo_luz_sala', 'on') }}"
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.demo_luz_sala}
        turn_off:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.demo_luz_sala}
      - name: Cocina
        unique_id: demo_light_cocina
        state: "{{ is_state('input_boolean.demo_luz_cocina', 'on') }}"
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.demo_luz_cocina}
        turn_off:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.demo_luz_cocina}
      - name: Dormitorio
        unique_id: demo_light_dormitorio
        state: "{{ is_state('input_boolean.demo_luz_dormitorio', 'on') }}"
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.demo_luz_dormitorio}
        turn_off:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.demo_luz_dormitorio}

person:
  - name: Yo
    id: demo_yo
  - name: Familiar
    id: demo_familiar
