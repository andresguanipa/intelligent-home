# =============================================================================
#  Home Assistant Core · "Config as Code" · 3D Floorplan Dashboard
# -----------------------------------------------------------------------------
#  Arranque:      docker compose up -d
#  Logs:          docker compose logs -f homeassistant
#  Reinicio:      docker compose restart homeassistant
#  Actualizar:    docker compose pull && docker compose up -d
#  UI:            http://<IP-del-host>:8123
# =============================================================================

services:
  homeassistant:
    container_name: homeassistant
    # Imagen oficial de Home Assistant Core (canal estable).
    # Para reproducibilidad total, fija una versión: p. ej. :2026.10
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped

    # Red del host: imprescindible para el autodescubrimiento (mDNS/SSDP),
    # Chromecast, HomeKit y el streaming WebRTC de la cámara Nest.
    # (En Docker Desktop para Mac/Windows, activa "Enable host networking"
    #  en Settings > Resources > Network, o cambia a "ports: - 8123:8123".)
    network_mode: host

    environment:
      # Zona horaria del contenedor (logs, automatizaciones por hora, etc.)
      - TZ=America/Denver

    volumes:
      # Toda la configuración versionable vive en ./config  →  /config
      - ./config:/config

      # Recursos estáticos del dashboard (imágenes del floorplan).
      # Home Assistant sirve /config/www en la URL /local/
      #   ./config/www/floorplan/casa_base.png  →  /local/floorplan/casa_base.png
      # Ya está incluido en el montaje anterior; se declara explícitamente
      # para dejar claro el contrato carpeta ↔ URL y poder moverlo a otro
      # disco en el futuro sin tocar el resto de la configuración.
      - ./config/www:/config/www

      # Sincroniza el reloj con el host (solo en hosts Linux).
      - /etc/localtime:/etc/localtime:ro

      # Opcional (Linux): necesario para la integración Bluetooth.
      # - /run/dbus:/run/dbus:ro
